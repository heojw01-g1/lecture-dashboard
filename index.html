<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>말랑소통연구소 · 예약 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF6F1;
    --surface:#FFFFFF;
    --ink:#3B322C;
    --muted:#948A7F;
    --faint:#D9CFC3;
    --line:#ECE1D6;
    --coral:#FF7F63;
    --coral-tint:#FFE7DE;
    --blue:#7E9BC4;
    --blue-tint:#E4EAF3;
    --sage:#8FAE84;
    --sage-tint:#E7EFE2;
    --grey:#A79E93;
    --grey-tint:#EFEAE3;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, sans-serif;
    line-height:1.6;
  }
  .wrap{
    max-width:680px;
    margin:0 auto;
    padding:0 18px 80px;
  }
  .sticky-header{
    position:sticky;
    top:0;
    background:var(--bg);
    padding:36px 0 16px;
    z-index:10;
  }
  .brand{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--coral);
    margin-bottom:8px;
  }
  .icon-row{
    display:flex;
    gap:10px;
    margin-top:14px;
  }
  .icon-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    background:var(--bg);
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
  }
  h1{
    font-family:'Gowun Dodum', sans-serif;
    font-size:28px;
    font-weight:400;
    margin:0 0 10px;
    line-height:1.4;
  }
  .lede{
    color:var(--muted);
    font-size:15px;
    margin:0 0 28px;
    max-width:48ch;
  }
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:24px;
    padding:14px 16px;
    background:var(--surface);
    border-radius:14px;
    border:1px solid var(--line);
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--muted);
  }
  .dot{
    width:9px;height:9px;border-radius:50%;
    flex-shrink:0;
  }
  .monthnav{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    scrollbar-width:none;
  }
  .monthnav::-webkit-scrollbar{display:none;}
  .monthpill{
    flex:0 0 auto;
    padding:7px 16px;
    border-radius:100px;
    font-size:13px;
    color:var(--muted);
    background:var(--surface);
    border:1px solid var(--line);
    white-space:nowrap;
    cursor:pointer;
  }
  .monthpill.current{
    background:var(--coral);
    color:#fff;
    border-color:var(--coral);
    font-weight:600;
  }
  .month{
    margin-top:34px;
    scroll-margin-top:20px;
  }
  .month-title{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:12px;
  }
  .month-title .name{
    font-family:'Gowun Dodum', sans-serif;
    font-size:19px;
  }
  .month-title .tag{
    font-size:12px;
    color:var(--coral);
    font-weight:600;
  }
  .dow-row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    margin-bottom:6px;
  }
  .dow-row div{
    text-align:center;
    font-size:12px;
    color:var(--muted);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:5px;
  }
  .cell{
    min-height:76px;
    border-radius:10px;
    padding:6px 5px;
    background:var(--surface);
    border:1px solid var(--line);
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .cell.out{
    background:transparent;
    border-color:transparent;
  }
  .cell.out .num{
    color:var(--faint);
  }
  .cell.today{
    border-color:var(--coral);
    border-width:2px;
  }
  .cell .num{
    font-family:'Gowun Dodum', sans-serif;
    font-size:13px;
  }
  .chip{
    font-size:10px;
    padding:2px 5px;
    border-radius:6px;
    line-height:1.35;
    white-space:normal;
    word-break:keep-all;
  }
  .region-원주{background:var(--coral-tint); color:#B8503A;}
  .region-서울{background:var(--blue-tint); color:#3E5A85;}
  .region-온라인{background:var(--grey-tint); color:#6B6257;}
  .region-수도권{background:var(--sage-tint); color:#4C6B44;}
  .dot-원주{background:var(--coral);}
  .dot-서울{background:var(--blue);}
  .dot-온라인{background:var(--grey);}
  .dot-수도권{background:var(--sage);}

  .cta{
    margin-top:48px;
    padding:24px 22px;
    background:var(--surface);
    border-radius:16px;
    border:1px solid var(--line);
  }
  .cta h2{
    font-family:'Gowun Dodum', sans-serif;
    font-weight:400;
    font-size:19px;
    margin:0 0 6px;
  }
  .cta p{
    color:var(--muted);
    font-size:14px;
    margin:0 0 18px;
  }
  .cta-links{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .cta-link{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:13px 16px;
    border-radius:12px;
    background:var(--bg);
    color:var(--ink);
    text-decoration:none;
    font-size:14.5px;
    font-weight:500;
  }
  .cta-link.primary{
    background:var(--coral);
    color:#fff;
  }
  .cta-link.disabled{
    color:var(--muted);
    cursor:default;
  }
  .cta-link .arrow{
    font-size:13px;
    opacity:0.7;
  }
  .foot-note{
    margin-top:24px;
    font-size:12px;
    color:var(--muted);
    text-align:center;
  }
  @media (max-width:420px){
    .cell{min-height:64px; padding:4px 3px;}
    .chip{font-size:9px; padding:1px 3px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="sticky-header">
    <span class="brand">말랑소통연구소</span>
    <h1>강의 예약 현황판</h1>
    <p class="lede">문의 전에 가능한 시간대를 먼저 확인해보세요.<br>강의가 이미 잡힌 시간대만 표시되며, 그 외 날짜는 문의하실 수 있습니다.</p>
    <div class="monthnav" id="monthnav"></div>
  </div>

  <div id="months"></div>

  <div class="cta">
    <h2>문의 및 안내</h2>
    <p>원하시는 시간대를 확인하셨다면, 아래 방법으로 편하게 문의해 주세요.</p>
    <div class="cta-links">
      <a class="cta-link disabled" href="#">구글폼으로 강의 문의하기 (준비 중) <span class="arrow">·</span></a>
      <a class="cta-link" href="https://brunch.co.kr/@3bf9e5429eb74a9" target="_blank">브런치스토리 칼럼 읽기 <span class="arrow">↗</span></a>
      <a class="cta-link" href="https://blog.naver.com/support_edu" target="_blank">네이버블로그에서 강의 후기 읽기 <span class="arrow">↗</span></a>
    </div>
    <div class="icon-row">
      <a class="icon-btn" href="https://www.instagram.com/malang_sotong/" target="_blank" aria-label="인스타그램">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="18" height="18" rx="5.5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <a class="icon-btn" href="https://www.youtube.com/@%EB%A7%90%EB%9E%91%EC%86%8C%ED%86%B5%EC%97%B0%EA%B5%AC%EC%86%8C" target="_blank" aria-label="유튜브">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="2.5" y="5.5" width="19" height="13" rx="4"/>
          <path d="M10.5 9.2v5.6l5-2.8-5-2.8z" fill="currentColor" stroke="none"/>
        </svg>
      </a>
    </div>
  </div>

</div>

<script>
// ---- 오늘 날짜 ----
const TODAY = new Date();
TODAY.setHours(0, 0, 0, 0);

// ---- 구글 앱스스크립트 웹 앱 URL ----
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyvNIX3KfAq5ZT30QhTXscw2I1pVwvq44CqnrWvXUvxKmc1DerX7pZMC-EM5WJ4cO1R/exec';

const regions = ['원주','서울','온라인','수도권'];
const DOW = ['월','화','수','목','금','토','일'];
const MONTH_NAMES = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

function iso(d){ return d.toISOString().slice(0,10); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function sameMonth(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth(); }

const monthnav = document.getElementById('monthnav');
const monthsEl = document.getElementById('months');

monthsEl.innerHTML = '<p style="color:var(--muted);font-size:14px;padding:30px 0;">일정을 불러오는 중...</p>';

fetch(APPS_SCRIPT_URL)
  .then(res => res.json())
  .then(sessions => renderCalendar(sessions))
  .catch(err => {
    monthsEl.innerHTML = '<p style="color:var(--muted);font-size:14px;padding:30px 0;">일정을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.</p>';
    console.error(err);
  });

function renderCalendar(sessions){
  monthnav.innerHTML = '';
  monthsEl.innerHTML = '';

  // 이번주 월요일 & 3개월 뒤
  const dow = (TODAY.getDay()+6)%7;
  const rangeStart = addDays(TODAY, -dow);
  const rangeEnd = addDays(rangeStart, 92);

  // 렌더링할 월 목록 계산 (rangeStart의 달 ~ rangeEnd의 달)
  let cursor = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), 1);
  const lastMonth = new Date(rangeEnd.getFullYear(), rangeEnd.getMonth(), 1);
  let monthIndex = 0;

  const pills = [];
  while(cursor <= lastMonth){
    const y = cursor.getFullYear();
    const m = cursor.getMonth();
    const monthId = `month-${monthIndex}`;
    const isCurrentMonth = sameMonth(cursor, TODAY);

    const pill = document.createElement('div');
    pill.className = 'monthpill' + (isCurrentMonth ? ' current' : '');
    pill.textContent = MONTH_NAMES[m];
    pill.onclick = ()=>{
      pills.forEach(p=>p.classList.remove('current'));
      pill.classList.add('current');
      document.getElementById(monthId).scrollIntoView({behavior:'smooth', block:'start'});
    };
    pills.push(pill);
    monthnav.appendChild(pill);

    const section = document.createElement('div');
    section.className = 'month';
    section.id = monthId;
    section.innerHTML = `<div class="month-title">
        <span class="name">${y}년 ${MONTH_NAMES[m]}</span>
        ${isCurrentMonth ? '<span class="tag">이번 달</span>' : ''}
      </div>
      <div class="dow-row">${DOW.map(d=>`<div>${d}</div>`).join('')}</div>
      <div class="grid" id="${monthId}-grid"></div>`;
    monthsEl.appendChild(section);

    const grid = section.querySelector(`#${monthId}-grid`);
    const firstOfMonth = new Date(y, m, 1);
    const firstDow = (firstOfMonth.getDay()+6)%7; // 월=0 기준 시작 요일
    const gridStart = addDays(firstOfMonth, -firstDow);

    for(let i=0;i<42;i++){
      const day = addDays(gridStart, i);
      const inMonth = sameMonth(day, firstOfMonth);
      if(i>=35 && !inMonth) break; // 6번째 줄이 전부 다음달이면 생략

      const dayIso = iso(day);
      const inRange = day >= rangeStart && day <= rangeEnd;
      const daySessions = inRange ? sessions.filter(s=>s.date===dayIso) : [];
      const isToday = dayIso === iso(TODAY);

      const isPast = day < TODAY;
      const cell = document.createElement('div');
      cell.className = 'cell' + ((!inMonth || isPast) ? ' out' : '') + (isToday ? ' today' : '');
      let chipsHtml = daySessions.map(s=>
        `<div class="chip region-${s.region}">${s.region} ${s.time}</div>`
      ).join('');
      cell.innerHTML = `<span class="num">${day.getDate()}</span>${chipsHtml}`;
      grid.appendChild(cell);
    }

    cursor = new Date(y, m+1, 1);
    monthIndex++;
  }

  // 고정 헤더 높이만큼 스크롤 여백을 동적으로 확보 (헤더에 가려지지 않도록)
  const headerHeight = document.querySelector('.sticky-header').offsetHeight;
  document.querySelectorAll('.month').forEach(sec=>{
    sec.style.scrollMarginTop = (headerHeight + 12) + 'px';
  });
}
</script>
</body>
</html>
